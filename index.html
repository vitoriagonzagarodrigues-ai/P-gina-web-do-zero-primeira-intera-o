<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #0045ac;
            color: #ffffff;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #FFFFFF;
            color: #000b6e;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        article{
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Meu blog water</h1>
        <p>Vou compartilhar conhecimentos e curiosidades sobre a água!</p>
    </header>
    <main>
        <article>
            <img src="imagem-blog.png"
                alt="Ilustração de uma paisagem natural vibrante com um riacho de águas cristalinas rodeado por pedras, peixes e vegetação verdejante. Ao fundo, há uma cachoeira sob um céu ensolarado. No centro superior da imagem, está escrito o título ÁGUA E CURIOSIDADES GERAIS em letras maiúsculas na cor azul escuro.">
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Vitoria Gonzaga</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar conhecimentos gerais sobre a água, e como isso pode
                    afetar a nossa vida</p>
                <button>💖​<span>0</span></button>
                <button>​👏​​​<span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector('span');
            texto.textContent++;
        }
    })


</script>

</html>
